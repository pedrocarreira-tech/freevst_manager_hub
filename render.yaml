services:
  - type: web
    name: vst-manager-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
  - type: static
    name: vst-manager-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: out
